name: New cloud app - four answers (plan only)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Lowercase app name, e.g. demo-status
        required: true
        type: string
      purpose:
        description: Public fictional description only; no private data
        required: true
        type: string
      hostname:
        description: Exact subdomain (empty defaults to app.amitk.life)
        required: false
        type: string
      budget:
        description: Incremental USD spend; fast path only allows zero
        required: true
        default: '0'
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Produce deterministic plan and Codex handoff
        env:
          APP: ${{ inputs.app }}
          PURPOSE: ${{ inputs.purpose }}
          HOSTNAME: ${{ inputs.hostname }}
          BUDGET: ${{ inputs.budget }}
          FACTORY_REVISION: ${{ github.sha }}
        run: |
          python3 cloud_bootstrap.py \
            --app "$APP" --purpose "$PURPOSE" --hostname "$HOSTNAME" \
            --budget "$BUDGET" --factory-revision "$FACTORY_REVISION" \
            --out bootstrap-output
          {
            echo 'Cloud App Factory: PLAN ONLY - no GitHub repo, Worker, DNS or secret changes.'
            echo 'Download the new-app bundle from the workflow artifact.'
            echo 'Use CODEX_CLOUD_GO.md in a published repository-bound Codex Cloud task.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain secret-free handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-app-bootstrap
          path: bootstrap-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
