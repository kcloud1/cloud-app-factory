name: Reusable dry-run factory
on:
  workflow_call:
    inputs:
      intake_path:
        description: Four-answer JSON in the caller repository
        required: true
        type: string
      factory_revision:
        description: Full reviewed factory commit SHA (match the workflow pin)
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: caller
      - name: Validate factory revision
        env:
          FACTORY_REVISION: ${{ inputs.factory_revision }}
          WORKFLOW_IDENTITY: ${{ toJSON(job) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["FACTORY_REVISION"]):
              raise SystemExit("Full factory SHA required")
          identity = json.loads(os.environ["WORKFLOW_IDENTITY"])
          if identity.get("workflow_repository") != "kcloud1/cloud-app-factory" or identity.get("workflow_sha") != os.environ["FACTORY_REVISION"]:
              raise SystemExit("Workflow and factory pins must match")
          PY
      - name: Checkout reviewed factory revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kcloud1/cloud-app-factory
          ref: ${{ inputs.factory_revision }}
          persist-credentials: false
          path: factory
      - name: Produce dry-run plan
        env:
          INTAKE_PATH: ${{ inputs.intake_path }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          root = Path("caller").resolve()
          source = (root / os.environ["INTAKE_PATH"]).resolve()
          if not source.is_relative_to(root) or not source.is_file():
              raise SystemExit("Intake must be a file inside the caller repository")
          with open("plan.json", "w") as output:
              subprocess.run(["python3", "factory/factory.py", "--intake", str(source)], stdout=output, check=True)
          PY
      - name: Retain public dry-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-plan
          path: plan.json
          retention-days: 7
